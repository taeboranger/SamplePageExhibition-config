apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-page-exhibition-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: sample-page-exhibition-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: vault-secrets-operator-system/cagea1-vault
  kubernetes:
    role: config-vso
    serviceAccount: sample-page-exhibition-vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: sample-page-exhibition-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: kv-v2
  mount: kv
  path: sample-page-exhibition-prod-secret
  refreshAfter: 1h
  vaultAuthRef: sample-page-exhibition-vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: sample-page-exhibition-deployment
  destination:
    create: true
    overwrite: true
    name: sample-page-exhibition-prod-secret
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        SITE_PASSWORD:
          text: |
            {{- $password := get .Secrets "site-password" -}}
            {{- if not $password -}}
              {{- fail "Vault data is missing site-password" -}}
            {{- end -}}
            {{- $password -}}
