apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-page-exhibition-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sample.anyproject.dev
    secretName: sample-page-exhibition-anyproject-tls
  - hosts:
    - sample.cagea1.com
    secretName: sample-page-exhibition-tls
  rules:
  - host: sample.anyproject.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sample-page-exhibition-service
            port:
              name: http
  - host: sample.cagea1.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sample-page-exhibition-service
            port:
              name: http
